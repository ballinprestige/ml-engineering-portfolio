[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-engineering-portfolio"
version = "0.1.0"
description = "Production-minded ML methods: leakage-safe validation, calibration, SHAP selection, drift detection."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Kyle Reynolds" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.0,<3",
    "scipy>=1.10,<2",
    "scikit-learn>=1.6,<2",
    "matplotlib>=3.7,<4",
    "shap>=0.44,<1",
    "xgboost>=2.0,<4",
]

[tool.setuptools]
py-modules = [
    "walk_forward_validation",
    "probability_calibration",
    "shap_feature_selection",
    "drift_detection",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E402: module-level import not at top — intentional for setting the matplotlib backend.
ignore = ["E402"]
